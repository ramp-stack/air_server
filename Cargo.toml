[package]
name = "air_server"
version = "2.0.0"
edition = "2024"
authors = ["Caleb Couch <caleb@orange.me>"]
description = "Resumable encrypted AIR clients and server over WebSocket and TLS"
license = "BSD-3-Clause"
repository = "https://github.com/ramp-stack/air_server"
readme = "README.md"
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md"]

[dependencies]
serde = {version="1.0", features=["derive"]}
air = {version = "4.0.0", path = "../air"}
easy_secp256k1 = "0.1.0"
secp256k1 = {version="0.31.1"}
hex = "0.4.3"
tokio = {version="1.44.2", features=["rt-multi-thread", "macros", "net", "time", "io-util"]}
serde_json = "1.0.145"
rusqlite = {version="0.39.0", features=["bundled"]}

crossfire = {version="3.1.7", features=["tokio"]}
tokio-tungstenite = "0.29.0"

rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls-pemfile = "2"
webpki-roots = "0.26"

futures-util = "0.3.32"
postcard = {version="1.1.3", features = ["alloc"]}
axum = {version="0.8.9", features=["ws"]}
im = {version="15.1.0", features=["serde"]}
arc-swap = {version="1.9.1", features=["serde"]}
postage = "0.5.0"
tokio-util = {version="0.7.18", features=["rt"]}
futures = "0.3.33"

[dev-dependencies]
air = {version = "4.0.0", path = "../air", features = ["local"]}
rcgen = "0.13"
