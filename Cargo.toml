[package]
name = "air_server"
version = "2.0.1"
edition = "2024"
authors = ["Caleb Couch <caleb@orange.me>"]
description = "Resumable encrypted AIR clients and server over WebSocket and TLS"
license = "BSD-3-Clause"
repository = "https://github.com/ramp-stack/air_server"
readme = "README.md"
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md"]

[dependencies]
serde = {version="1.0", features=["derive"]}
air = {version = "4.0.1", path = "../air"}
tokio = {version="1.44.2", features=["rt-multi-thread", "macros", "net", "time", "io-util", "sync"]}
serde_json = "1.0.145"
rusqlite = {version="0.39.0", features=["bundled"]}

crossfire = {version="3.1.7", features=["tokio"]}
tokio-tungstenite = "0.29.0"

rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls-pemfile = "2"
webpki-roots = "0.26"

futures-util = {version = "0.3.32", default-features = false, features = ["std", "sink"]}
postcard = {version="1.1.3", features = ["alloc"]}
tokio-util = {version="0.7.18", features=["rt"]}

[dev-dependencies]
air = {version = "4.0.1", path = "../air", features = ["local"]}
